spring.application.name=tree-server
spring.config.import=optional:file:../.env[.properties]
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:3001}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=3
spring.flyway.validate-migration-naming=true
management.endpoints.web.exposure.include=health,info
server.error.include-message=never
server.error.include-stacktrace=never
server.forward-headers-strategy=framework
server.servlet.session.cookie.name=TREE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:12h}
spring.session.jdbc.initialize-schema=never
tree.auth.client-base-url=${CLIENT_BASE_URL:http://localhost:5173}
tree.auth.bootstrap.email=${BOOTSTRAP_ADMIN_EMAIL:${BOOTSTRAP_OWNER_EMAIL:}}
tree.auth.bootstrap.password=${BOOTSTRAP_ADMIN_PASSWORD:${BOOTSTRAP_OWNER_PASSWORD:}}
tree.auth.bootstrap.display-name=${BOOTSTRAP_ADMIN_DISPLAY_NAME:${BOOTSTRAP_OWNER_DISPLAY_NAME:Tree Administrator}}
tree.auth.google.enabled=${GOOGLE_AUTH_ENABLED:false}
tree.auth.google.client-id=${GOOGLE_CLIENT_ID:}
tree.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
tree.auth.google.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:5173/login/oauth2/code/google}
